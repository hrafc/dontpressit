<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff2a2a">

  <title>DON'T PRESS IT</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;

      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0b0b;
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }

    button {
      user-select: none;
      -webkit-user-select: none;
    }

    /* =========================
       GAME
    ========================== */

    .game {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* =========================
       TOP BAR
    ========================== */

    .topbar {
      width: 100%;
      padding: 18px 25px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      background: #111;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .logo span {
      color: #ff2a2a;
    }

    .stats {
      display: flex;
      gap: 25px;
      font-weight: bold;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      color: #777;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat-value {
      font-size: 20px;
    }

    /* =========================
       MAIN
    ========================== */

    .main {
      flex: 1;
      padding: 25px;
      display: flex;
    }

    /* =========================
       PLAY AREA
    ========================== */

    .play-area {
      width: 100%;
      min-height: 650px;

      background: #101010;
      border: 1px solid #202020;
      border-radius: 18px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      position: relative;
      overflow: hidden;
    }

    /* =========================
       WARNING
    ========================== */

    .warning {
      font-size: 16px;
      color: #aaa;
      margin-bottom: 25px;

      letter-spacing: 1px;
      text-align: center;
    }

    .warning strong {
      color: #ff2a2a;
    }

    /* =========================
       BUTTON
    ========================== */

    .button-wrapper {
      position: relative;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .main-button {
      width: 240px;
      height: 240px;

      border-radius: 50%;
      border: 10px solid #7c0000;

      background: radial-gradient(
        circle at 35% 30%,
        #ff5555,
        #e50000 55%,
        #8b0000 100%
      );

      box-shadow:
        0 18px 0 #550000,
        0 25px 40px rgba(0, 0, 0, 0.6);

      color: white;
      font-size: 25px;
      font-weight: 900;

      cursor: pointer;

      transition:
        transform 0.08s,
        box-shadow 0.08s;
    }

    .main-button:hover {
      transform: scale(1.03);
    }

    .main-button:active {
      transform: translateY(9px) scale(0.98);

      box-shadow:
        0 8px 0 #550000,
        0 15px 25px rgba(0, 0, 0, 0.6);
    }

    /* =========================
       COUNTER
    ========================== */

    .press-count {
      margin-top: 35px;

      font-size: 44px;
      font-weight: 900;
    }

    .press-label {
      margin-top: 4px;

      color: #666;

      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 3px;
    }

    /* =========================
       FOOTER
    ========================== */

    .footer {
      padding: 15px;

      text-align: center;

      color: #444;
      font-size: 11px;
    }

    /* =========================
       MODAL OVERLAY
    ========================== */

    .modal-overlay {
      position: fixed;
      inset: 0;

      display: none;
      justify-content: center;
      align-items: center;

      padding: 20px;

      background: rgba(0, 0, 0, 0.78);

      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);

      z-index: 9999;
    }

    .modal-overlay.show {
      display: flex;
    }

    /* =========================
       MODAL
    ========================== */

    .modal {
      width: min(420px, 100%);

      padding: 30px;

      background: #111;

      border: 1px solid #333;
      border-radius: 18px;

      text-align: center;

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.75);

      animation: modalPop 0.2s ease;
    }

    .modal-message {
      color: white;

      font-size: 24px;
      font-weight: 900;

      line-height: 1.3;

      margin-bottom: 25px;
    }

    .modal-close {
      border: none;

      padding: 12px 24px;

      border-radius: 10px;

      background: #ff2a2a;
      color: white;

      font-size: 14px;
      font-weight: 900;

      cursor: pointer;

      transition:
        transform 0.15s,
        background 0.15s;
    }

    .modal-close:hover {
      transform: scale(1.05);
      background: #ff4040;
    }

    .modal-close:active {
      transform: scale(0.97);
    }

    /* =========================
       MODAL ANIMATION
    ========================== */

    @keyframes modalPop {
      from {
        opacity: 0;
        transform: scale(0.85);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* =========================
       RESPONSIVE
    ========================== */

    @media (max-width: 600px) {

      .topbar {
        flex-direction: column;
        gap: 15px;
      }

      .stats {
        gap: 20px;
      }

      .main {
        padding: 12px;
      }

      .play-area {
        min-height: 520px;
      }

      .main-button {
        width: 190px;
        height: 190px;
      }

      .press-count {
        font-size: 36px;
      }

      .warning {
        font-size: 14px;
        padding: 0 15px;
      }

      .modal {
        padding: 25px;
      }

      .modal-message {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <div class="game">

    <!-- =========================
         TOP BAR
    ========================== -->

    <header class="topbar">

      <div class="logo">
        DON'T <span>PRESS IT</span>
      </div>

      <div class="stats">

        <div class="stat">

          <span class="stat-label">
            Points
          </span>

          <span
            class="stat-value"
            id="points"
          >
            0
          </span>

        </div>

        <div class="stat">

          <span class="stat-label">
            Per Press
          </span>

          <span
            class="stat-value"
            id="perPress"
          >
            1
          </span>

        </div>

      </div>

    </header>


    <!-- =========================
         MAIN GAME
    ========================== -->

    <main class="main">

      <section class="play-area">

        <div class="warning">
          Whatever you do...
          <strong>DON'T PRESS IT.</strong>
        </div>


        <div class="button-wrapper">

          <button
            class="main-button"
            id="mainButton"
            type="button"
          >
            DON'T PRESS
          </button>

        </div>


        <div
          class="press-count"
          id="pressCount"
        >
          0
        </div>


        <div class="press-label">
          presses
        </div>

      </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="footer">
      You were warned.
    </footer>

  </div>


  <!-- =========================
       MILESTONE MODAL
  ========================== -->

  <div
    class="modal-overlay"
    id="modalOverlay"
  >

    <div class="modal">

      <div
        class="modal-message"
        id="modalMessage"
      >
        DO NOT KEEP GOING.
      </div>

      <button
        class="modal-close"
        id="modalClose"
        type="button"
      >
        CONTINUE
      </button>

    </div>

  </div>


  <!-- =========================
       GAME JAVASCRIPT
  ========================== -->

  <script>

    /* =========================
       GAME STATE
    ========================== */

    const game = {

      presses:
        Number(
          localStorage.getItem(
            "dontPressPresses"
          )
        ) || 0,

      points:
        Number(
          localStorage.getItem(
            "dontPressPoints"
          )
        ) || 0,

      pointsPerPress: 1

    };


    /* =========================
       DOM
    ========================== */

    const mainButton =
      document.getElementById(
        "mainButton"
      );

    const pressCount =
      document.getElementById(
        "pressCount"
      );

    const pointsDisplay =
      document.getElementById(
        "points"
      );

    const perPressDisplay =
      document.getElementById(
        "perPress"
      );

    const modalOverlay =
      document.getElementById(
        "modalOverlay"
      );

    const modalMessage =
      document.getElementById(
        "modalMessage"
      );

    const modalClose =
      document.getElementById(
        "modalClose"
      );


    /* =========================
       SAVE GAME
    ========================== */

    function saveGame() {

      localStorage.setItem(
        "dontPressPresses",
        game.presses
      );

      localStorage.setItem(
        "dontPressPoints",
        game.points
      );

    }


    /* =========================
       UPDATE UI
    ========================== */

    function updateUI() {

      pressCount.textContent =
        game.presses.toLocaleString();

      pointsDisplay.textContent =
        game.points.toLocaleString();

      perPressDisplay.textContent =
        game.pointsPerPress.toLocaleString();

    }


    /* =========================
       SHOW MODAL
    ========================== */

    function showModal(message) {

      modalMessage.textContent =
        message;

      modalOverlay.classList.add(
        "show"
      );

    }


    /* =========================
       CLOSE MODAL
    ========================== */

    function closeModal() {

      modalOverlay.classList.remove(
        "show"
      );

    }


    /* =========================
       BUTTON PRESS
    ========================== */

    function pressButton() {

      game.presses++;

      game.points +=
        game.pointsPerPress;

      saveGame();

      updateUI();

      checkMilestone();

    }


    /* =========================
       MILESTONES
    ========================== */

    function checkMilestone() {

      /* =====================
         10 PRESSES
      ===================== */

      if (game.presses === 10) {

        showModal(
          "KEEP GOING."
        );

        return;
      }


      /* =====================
         50 PRESSES
      ===================== */

      if (game.presses === 50) {

        showModal(
          "PLS STOP."
        );

        return;
      }


      /* =====================
         100 PRESSES
      ===================== */

      if (game.presses === 100) {

        showModal(
          "PLEASE SUBSCRIBE 😭"
        );

        modalClose.textContent =
          "SUBSCRIBE";

        setTimeout(() => {

          window.location.href =
            "https://www.youtube.com/@ryu_zaki.67";

        }, 1500);

        return;
      }


      /* =====================
         150 PRESSES
      ===================== */

      if (game.presses === 150) {

        showModal(
          "YOU MADE IT THIS FAR 💀"
        );

        modalClose.textContent =
          "CONTINUE";

        setTimeout(() => {

          window.location.href =
            "https://www.youtube.com/watch?v=dQw4w9WgXcQ";

        }, 1200);

        return;
      }


      /* =====================
         200 PRESSES
      ===================== */

      if (game.presses === 200) {

        showModal(
          "WELL DONE 🔴"
        );

        modalClose.textContent =
          "CONTINUE";

        setTimeout(() => {

          window.location.href =
            "https://www.youtube.com/watch?v=8B3zKexjXxw";

        }, 1500);

        return;
      }

    }


    /* =========================
       MODAL CLOSE BUTTON
    ========================== */

    modalClose.addEventListener(
      "click",
      closeModal
    );


    /* =========================
       CLICK OUTSIDE MODAL
    ========================== */

    modalOverlay.addEventListener(
      "click",
      (event) => {

        if (
          event.target ===
          modalOverlay
        ) {

          closeModal();

        }

      }
    );


    /* =========================
       ESC KEY
    ========================== */

    document.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Escape"
        ) {

          closeModal();

        }

      }
    );


    /* =========================
       MAIN BUTTON
    ========================== */

    mainButton.addEventListener(
      "click",
      pressButton
    );


    /* =========================
       COPY PROTECTION
    ========================== */

    document.addEventListener(
      "copy",
      (event) => {

        event.preventDefault();

      }
    );


    document.addEventListener(
      "cut",
      (event) => {

        event.preventDefault();

      }
    );


    document.addEventListener(
      "contextmenu",
      (event) => {

        event.preventDefault();

      }
    );


    document.addEventListener(
      "dragstart",
      (event) => {

        event.preventDefault();

      }
    );


    /* =========================
       START GAME
    ========================== */

    updateUI();

  </script>


  <!-- =========================
       SERVICE WORKER
  ========================== -->

  <script>

    if (
      "serviceWorker" in navigator
    ) {

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker
            .register("./sw.js")

            .then(
              (registration) => {

                console.log(
                  "Service Worker registered:",
                  registration.scope
                );

              }
            )

            .catch(
              (error) => {

                console.error(
                  "Service Worker registration failed:",
                  error
                );

              }
            );

        }
      );

    }

  </script>

</body>
</html>
