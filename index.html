<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff2a2a">

  <title>DON'T PRESS IT</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0b0b;
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }

    button {
      -webkit-user-select: none;
      user-select: none;
    }

    /* =========================
       APP
    ========================= */

    .game {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* =========================
       TOP BAR
    ========================= */

    .topbar {
      width: 100%;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .logo span {
      color: #ff2a2a;
    }

    .stats {
      display: flex;
      gap: 25px;
      font-weight: bold;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      color: #777;
      font-size: 11px;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 20px;
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      flex: 1;
      padding: 25px;
      display: flex;
    }

    /* =========================
       PLAY AREA
    ========================= */

    .play-area {
      width: 100%;
      min-height: 650px;

      background: #101010;
      border: 1px solid #202020;
      border-radius: 18px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      position: relative;
      overflow: hidden;
    }

    /* =========================
       WARNING
    ========================= */

    .warning {
      font-size: 16px;
      color: #aaa;
      margin-bottom: 25px;
      letter-spacing: 1px;
      text-align: center;
    }

    .warning strong {
      color: #ff2a2a;
    }

    /* =========================
       BUTTON
    ========================= */

    .button-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .main-button {
      width: 240px;
      height: 240px;

      border-radius: 50%;
      border: 10px solid #7c0000;

      background: radial-gradient(
        circle at 35% 30%,
        #ff5555,
        #e50000 55%,
        #8b0000 100%
      );

      box-shadow:
        0 18px 0 #550000,
        0 25px 40px rgba(0, 0, 0, 0.6);

      color: white;
      font-size: 25px;
      font-weight: 900;

      cursor: pointer;

      transition:
        transform 0.08s,
        box-shadow 0.08s;
    }

    .main-button:hover {
      transform: scale(1.03);
    }

    .main-button:active {
      transform: translateY(9px) scale(0.98);

      box-shadow:
        0 8px 0 #550000,
        0 15px 25px rgba(0, 0, 0, 0.6);
    }

    /* =========================
       COUNTER
    ========================= */

    .press-count {
      margin-top: 35px;
      font-size: 44px;
      font-weight: 900;
    }

    .press-label {
      color: #666;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 3px;
      margin-top: 4px;
    }

    /* =========================
       MESSAGE
    ========================= */

    .message-box {
      margin-top: 40px;

      width: min(500px, 90%);
      min-height: 55px;

      background: #161616;
      border: 1px solid #292929;
      border-radius: 12px;

      display: flex;
      justify-content: center;
      align-items: center;

      text-align: center;
      padding: 15px;

      color: #bbb;
      font-size: 14px;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      padding: 15px;
      text-align: center;
      color: #444;
      font-size: 11px;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 600px) {

      .topbar {
        flex-direction: column;
        gap: 15px;
      }

      .stats {
        gap: 20px;
      }

      .main {
        padding: 12px;
      }

      .play-area {
        min-height: 520px;
      }

      .main-button {
        width: 190px;
        height: 190px;
      }

      .press-count {
        font-size: 36px;
      }

      .warning {
        font-size: 14px;
        padding: 0 15px;
      }
    }
  </style>
</head>

<body>

  <div class="game">

    <!-- =========================
         TOP BAR
    ========================== -->

    <header class="topbar">

      <div class="logo">
        DON'T <span>PRESS IT</span>
      </div>

      <div class="stats">

        <div class="stat">
          <span class="stat-label">Points</span>
          <span
            class="stat-value"
            id="points"
          >
            0
          </span>
        </div>

        <div class="stat">
          <span class="stat-label">Per Press</span>
          <span
            class="stat-value"
            id="perPress"
          >
            1
          </span>
        </div>

      </div>

    </header>


    <!-- =========================
         MAIN GAME
    ========================== -->

    <main class="main">

      <section class="play-area">

        <div class="warning">
          Whatever you do...
          <strong>DON'T PRESS IT.</strong>
        </div>


        <div class="button-wrapper">

          <button
            class="main-button"
            id="mainButton"
          >
            DON'T PRESS
          </button>

        </div>


        <div
          class="press-count"
          id="pressCount"
        >
          0
        </div>


        <div class="press-label">
          presses
        </div>


        <div
          class="message-box"
          id="messageBox"
        >
          The button is waiting...
        </div>

      </section>

    </main>


    <footer class="footer">
      You were warned.
    </footer>

  </div>


  <!-- =========================
       GAME JS
  ========================== -->

  <script>

    const game = {
      presses: 0,
      points: 0,
      pointsPerPress: 1
    };


    const mainButton =
      document.getElementById("mainButton");

    const pressCount =
      document.getElementById("pressCount");

    const pointsDisplay =
      document.getElementById("points");

    const perPressDisplay =
      document.getElementById("perPress");

    const messageBox =
      document.getElementById("messageBox");


    /* =========================
       UPDATE UI
    ========================= */

    function updateUI() {

      pressCount.textContent =
        game.presses.toLocaleString();

      pointsDisplay.textContent =
        game.points.toLocaleString();

      perPressDisplay.textContent =
        game.pointsPerPress.toLocaleString();

    }


    /* =========================
       PRESS BUTTON
    ========================= */

    function pressButton() {

      game.presses++;

      game.points += game.pointsPerPress;

      updateUI();

    }


    /* =========================
       BUTTON EVENT
    ========================= */

    mainButton.addEventListener(
      "click",
      pressButton
    );


    /* =========================
       BLOCK COPYING
    ========================= */

    document.addEventListener(
      "copy",
      (event) => {
        event.preventDefault();
      }
    );

    document.addEventListener(
      "cut",
      (event) => {
        event.preventDefault();
      }
    );

    document.addEventListener(
      "contextmenu",
      (event) => {
        event.preventDefault();
      }
    );


    /* =========================
       START
    ========================= */

    updateUI();

  </script>


  <!-- =========================
       SERVICE WORKER
  ========================== -->

  <script>

    if ("serviceWorker" in navigator) {

      window.addEventListener("load", () => {

        navigator.serviceWorker
          .register("./sw.js")

          .then((registration) => {

            console.log(
              "Service Worker registered:",
              registration.scope
            );

          })

          .catch((error) => {

            console.error(
              "Service Worker registration failed:",
              error
            );

          });

      });

    }

  </script>

</body>
</html>
