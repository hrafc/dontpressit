<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff2a2a">

  <title>DON'T PRESS IT</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;

      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0b0b;
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }

    button {
      user-select: none;
      -webkit-user-select: none;
    }

    /* =========================
       GAME
    ========================= */

    .game {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* =========================
       TOP BAR
    ========================= */

    .topbar {
      width: 100%;
      padding: 18px 25px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      background: #111;
      border-bottom: 1px solid #222;

      gap: 20px;
    }

    .logo {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .logo span {
      color: #ff2a2a;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .stats {
      display: flex;
      gap: 25px;
      font-weight: bold;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      color: #777;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat-value {
      font-size: 20px;
    }

    /* =========================
       RESET BUTTON
    ========================= */

    .reset-button {
      border: 1px solid #333;
      background: #191919;
      color: #aaa;

      padding: 9px 13px;
      border-radius: 8px;

      font-size: 11px;
      font-weight: 800;

      cursor: pointer;

      transition:
        background 0.15s,
        color 0.15s,
        transform 0.15s;
    }

    .reset-button:hover {
      background: #252525;
      color: white;
    }

    .reset-button:active {
      transform: scale(0.96);
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      flex: 1;
      padding: 25px;

      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* =========================
       PLAY AREA
    ========================= */

    .play-area {
      width: 100%;
      min-height: 620px;

      background: #101010;
      border: 1px solid #202020;
      border-radius: 18px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      position: relative;
      overflow: hidden;
    }

    /* =========================
       WARNING
    ========================= */

    .warning {
      font-size: 16px;
      color: #aaa;
      margin-bottom: 25px;

      letter-spacing: 1px;
      text-align: center;
    }

    .warning strong {
      color: #ff2a2a;
    }

    /* =========================
       BUTTON
    ========================= */

    .button-wrapper {
      position: relative;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .main-button {
      width: 240px;
      height: 240px;

      border-radius: 50%;
      border: 10px solid #7c0000;

      background: radial-gradient(
        circle at 35% 30%,
        #ff5555,
        #e50000 55%,
        #8b0000 100%
      );

      box-shadow:
        0 18px 0 #550000,
        0 25px 40px rgba(0, 0, 0, 0.6);

      color: white;
      font-size: 25px;
      font-weight: 900;

      cursor: pointer;

      transition:
        transform 0.08s,
        box-shadow 0.08s;
    }

    .main-button:hover {
      transform: scale(1.03);
    }

    .main-button:active {
      transform: translateY(9px) scale(0.98);

      box-shadow:
        0 8px 0 #550000,
        0 15px 25px rgba(0, 0, 0, 0.6);
    }

    /* =========================
       COUNTER
    ========================= */

    .press-count {
      margin-top: 35px;

      font-size: 44px;
      font-weight: 900;
    }

    .press-label {
      margin-top: 4px;

      color: #666;

      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 3px;
    }

    /* =========================
       PROGRESS SECTION
    ========================= */

    .progress-panel {
      width: 100%;

      background: #101010;
      border: 1px solid #202020;
      border-radius: 18px;

      padding: 22px 24px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 18px;
      gap: 15px;
    }

    .progress-title {
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .progress-status {
      color: #777;
      font-size: 12px;
    }

    /* =========================
       PROGRESS BAR
    ========================= */

    .progress-track {
      position: relative;

      width: 100%;
      height: 10px;

      background: #242424;
      border-radius: 999px;

      overflow: visible;
    }

    .progress-fill {
      position: absolute;
      left: 0;
      top: 0;

      height: 100%;
      width: 0%;

      background: linear-gradient(
        90deg,
        #ff2a2a,
        #ff5555
      );

      border-radius: 999px;

      transition: width 0.25s ease;
    }

    /* =========================
       PROGRESS MILESTONES
    ========================= */

    .milestones {
      position: relative;

      width: 100%;

      margin-top: 15px;
    }

    .milestone {
      position: absolute;
      top: 0;

      transform: translateX(-50%);

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 7px;

      min-width: 55px;
    }

    .milestone-dot {
      width: 17px;
      height: 17px;

      border-radius: 50%;

      background: #292929;
      border: 2px solid #444;

      transition:
        background 0.2s,
        border-color 0.2s,
        transform 0.2s,
        box-shadow 0.2s;
    }

    .milestone.completed .milestone-dot {
      background: #ff2a2a;
      border-color: #ff5555;

      box-shadow:
        0 0 15px rgba(255, 42, 42, 0.4);
    }

    .milestone.next .milestone-dot {
      transform: scale(1.2);

      border-color: #ff2a2a;
      box-shadow:
        0 0 14px rgba(255, 42, 42, 0.3);
    }

    .milestone-number {
      font-size: 11px;
      font-weight: 900;
      color: #777;
      white-space: nowrap;
    }

    .milestone.completed .milestone-number {
      color: white;
    }

    .milestone.next .milestone-number {
      color: #ff5555;
    }

    /* =========================
       MODAL OVERLAY
    ========================= */

    .modal-overlay {
      position: fixed;
      inset: 0;

      display: none;
      justify-content: center;
      align-items: center;

      padding: 20px;

      background: rgba(0, 0, 0, 0.78);

      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);

      z-index: 9999;
    }

    .modal-overlay.show {
      display: flex;
    }

    /* =========================
       MODAL
    ========================= */

    .modal {
      width: min(420px, 100%);

      padding: 30px;

      background: #111;

      border: 1px solid #333;
      border-radius: 18px;

      text-align: center;

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.75);

      animation: modalPop 0.2s ease;
    }

    .modal-message {
      color: white;

      font-size: 24px;
      font-weight: 900;

      line-height: 1.3;

      margin-bottom: 25px;
    }

    .modal-close {
      border: none;

      padding: 12px 24px;

      border-radius: 10px;

      background: #ff2a2a;
      color: white;

      font-size: 14px;
      font-weight: 900;

      cursor: pointer;

      transition:
        transform 0.15s,
        background 0.15s;
    }

    .modal-close:hover {
      transform: scale(1.05);
      background: #ff4040;
    }

    .modal-close:active {
      transform: scale(0.97);
    }

    /* =========================
       RESET CONFIRM MODAL
    ========================= */

    .reset-modal-text {
      color: #aaa;

      font-size: 13px;
      line-height: 1.5;

      margin-top: -10px;
      margin-bottom: 22px;
    }

    .reset-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .reset-cancel,
    .reset-confirm {
      border: none;

      padding: 11px 18px;

      border-radius: 9px;

      font-weight: 900;
      cursor: pointer;
    }

    .reset-cancel {
      background: #252525;
      color: #aaa;
    }

    .reset-confirm {
      background: #ff2a2a;
      color: white;
    }

    .reset-cancel:hover {
      background: #303030;
    }

    .reset-confirm:hover {
      background: #ff4040;
    }

    /* =========================
       MODAL ANIMATION
    ========================= */

    @keyframes modalPop {

      from {
        opacity: 0;
        transform: scale(0.85);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }

    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      padding: 15px;

      text-align: center;

      color: #444;
      font-size: 11px;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 700px) {

      .topbar {
        flex-direction: column;
        align-items: stretch;
      }

      .top-right {
        justify-content: space-between;
      }

      .stats {
        gap: 20px;
      }

      .progress-panel {
        padding: 18px 14px;
      }

      .milestone-number {
        font-size: 10px;
      }

      .main-button {
        width: 210px;
        height: 210px;
      }

      .press-count {
        font-size: 38px;
      }

    }

    @media (max-width: 480px) {

      .main {
        padding: 12px;
      }

      .play-area {
        min-height: 520px;
      }

      .main-button {
        width: 185px;
        height: 185px;
      }

      .progress-status {
        font-size: 11px;
      }

      .warning {
        font-size: 14px;
        padding: 0 15px;
      }

      .modal {
        padding: 25px;
      }

      .modal-message {
        font-size: 21px;
      }

    }
  </style>
</head>

<body>

  <div class="game">

    <!-- =========================
         TOP BAR
    ========================= -->

    <header class="topbar">

      <div class="logo">
        DON'T <span>PRESS IT</span>
      </div>

      <div class="top-right">

        <div class="stats">

          <div class="stat">

            <span class="stat-label">
              Points
            </span>

            <span
              class="stat-value"
              id="points"
            >
              0
            </span>

          </div>

          <div class="stat">

            <span class="stat-label">
              Per Press
            </span>

            <span
              class="stat-value"
              id="perPress"
            >
              1
            </span>

          </div>

        </div>

        <button
          class="reset-button"
          id="resetButton"
          type="button"
        >
          RESET SCORE
        </button>

      </div>

    </header>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="main">

      <!-- GAME -->

      <section class="play-area">

        <div class="warning">
          Whatever you do...
          <strong>DON'T PRESS IT.</strong>
        </div>


        <div class="button-wrapper">

          <button
            class="main-button"
            id="mainButton"
            type="button"
          >
            DON'T PRESS
          </button>

        </div>


        <div
          class="press-count"
          id="pressCount"
        >
          0
        </div>


        <div class="press-label">
          presses
        </div>

      </section>


      <!-- =========================
           PROGRESS
      ========================= -->

      <section class="progress-panel">

        <div class="progress-header">

          <div class="progress-title">
            Progress
          </div>

          <div
            class="progress-status"
            id="progressStatus"
          >
            Next goal: 10
          </div>

        </div>


        <div class="progress-track">

          <div
            class="progress-fill"
            id="progressFill"
          ></div>

        </div>


        <div
          class="milestones"
          id="milestones"
        >

          <div
            class="milestone"
            data-goal="10"
            style="left: 5%;"
          >

            <div class="milestone-dot"></div>

            <div class="milestone-number">
              10
            </div>

          </div>


          <div
            class="milestone"
            data-goal="50"
            style="left: 25%;"
          >

            <div class="milestone-dot"></div>

            <div class="milestone-number">
              50
            </div>

          </div>


          <div
            class="milestone"
            data-goal="100"
            style="left: 50%;"
          >

            <div class="milestone-dot"></div>

            <div class="milestone-number">
              100
            </div>

          </div>


          <div
            class="milestone"
            data-goal="150"
            style="left: 75%;"
          >

            <div class="milestone-dot"></div>

            <div class="milestone-number">
              150
            </div>

          </div>


          <div
            class="milestone"
            data-goal="200"
            style="left: 100%;"
          >

            <div class="milestone-dot"></div>

            <div class="milestone-number">
              200
            </div>

          </div>

        </div>

      </section>

    </main>


    <footer class="footer">
      You were warned.
    </footer>

  </div>


  <!-- =========================
       MILESTONE MODAL
  ========================= -->

  <div
    class="modal-overlay"
    id="modalOverlay"
  >

    <div class="modal">

      <div
        class="modal-message"
        id="modalMessage"
      >
        KEEP GOING.
      </div>

      <button
        class="modal-close"
        id="modalClose"
        type="button"
      >
        CONTINUE
      </button>

    </div>

  </div>


  <!-- =========================
       RESET MODAL
  ========================= -->

  <div
    class="modal-overlay"
    id="resetOverlay"
  >

    <div class="modal">

      <div class="modal-message">
        RESET SCORE?
      </div>

      <div class="reset-modal-text">
        This will delete your current presses
        and points permanently.
      </div>

      <div class="reset-actions">

        <button
          class="reset-cancel"
          id="resetCancel"
          type="button"
        >
          CANCEL
        </button>

        <button
          class="reset-confirm"
          id="resetConfirm"
          type="button"
        >
          RESET
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       GAME JAVASCRIPT
  ========================= -->

  <script>

    /* =========================
       GAME STATE
    ========================= */

    const game = {

      presses:
        Number(
          localStorage.getItem(
            "dontPressPresses"
          )
        ) || 0,

      points:
        Number(
          localStorage.getItem(
            "dontPressPoints"
          )
        ) || 0,

      pointsPerPress: 1

    };


    /* =========================
       GOALS
    ========================= */

    const goals = [
      10,
      50,
      100,
      150,
      200
    ];


    /* =========================
       LINKS
    ========================= */

    const milestoneLinks = {

      100:
        "https://www.youtube.com/@ryu_zaki.67",

      150:
        "https://www.youtube.com/watch?v=dQw4w9WgXcQ",

      200:
        "https://www.youtube.com/watch?v=8B3zKexjXxw"

    };


    /* =========================
       DOM
    ========================= */

    const mainButton =
      document.getElementById(
        "mainButton"
      );

    const pressCount =
      document.getElementById(
        "pressCount"
      );

    const pointsDisplay =
      document.getElementById(
        "points"
      );

    const perPressDisplay =
      document.getElementById(
        "perPress"
      );

    const progressFill =
      document.getElementById(
        "progressFill"
      );

    const progressStatus =
      document.getElementById(
        "progressStatus"
      );

    const modalOverlay =
      document.getElementById(
        "modalOverlay"
      );

    const modalMessage =
      document.getElementById(
        "modalMessage"
      );

    const modalClose =
      document.getElementById(
        "modalClose"
      );

    const resetButton =
      document.getElementById(
        "resetButton"
      );

    const resetOverlay =
      document.getElementById(
        "resetOverlay"
      );

    const resetCancel =
      document.getElementById(
        "resetCancel"
      );

    const resetConfirm =
      document.getElementById(
        "resetConfirm"
      );


    /* =========================
       SAVE
    ========================= */

    function saveGame() {

      localStorage.setItem(
        "dontPressPresses",
        game.presses
      );

      localStorage.setItem(
        "dontPressPoints",
        game.points
      );

    }


    /* =========================
       UPDATE UI
    ========================= */

    function updateUI() {

      pressCount.textContent =
        game.presses.toLocaleString();

      pointsDisplay.textContent =
        game.points.toLocaleString();

      perPressDisplay.textContent =
        game.pointsPerPress.toLocaleString();

      updateProgress();

    }


    /* =========================
       UPDATE PROGRESS
    ========================= */

    function updateProgress() {

      const progress =
        Math.min(
          (game.presses / 200) * 100,
          100
        );

      progressFill.style.width =
        `${progress}%`;


      /* Reset milestone states */

      document
        .querySelectorAll(".milestone")
        .forEach((milestone) => {

          const goal =
            Number(
              milestone.dataset.goal
            );

          milestone.classList.remove(
            "completed",
            "next"
          );

          if (
            game.presses >= goal
          ) {

            milestone.classList.add(
              "completed"
            );

          }

        });


      /* Find next goal */

      const nextGoal =
        goals.find(
          (goal) =>
            game.presses < goal
        );


      if (nextGoal) {

        progressStatus.textContent =
          `Next goal: ${nextGoal.toLocaleString()} clicks`;

        const nextMilestone =
          document.querySelector(
            `.milestone[data-goal="${nextGoal}"]`
          );

        if (nextMilestone) {

          nextMilestone.classList.add(
            "next"
          );

        }

      } else {

        progressStatus.textContent =
          "ALL GOALS COMPLETE 🔴";

      }

    }


    /* =========================
       SHOW MODAL
    ========================= */

    function showModal(message) {

      modalMessage.textContent =
        message;

      modalOverlay.classList.add(
        "show"
      );

    }


    /* =========================
       CLOSE MODAL
    ========================= */

    function closeModal() {

      modalOverlay.classList.remove(
        "show"
      );

    }


    /* =========================
       PRESS BUTTON
    ========================= */

    function pressButton() {

      game.presses++;

      game.points +=
        game.pointsPerPress;

      saveGame();

      updateUI();

      checkMilestone();

    }


    /* =========================
       MILESTONES
    ========================= */

    function checkMilestone() {

      /* =====================
         10
      ===================== */

      if (game.presses === 10) {

        showModal(
          "KEEP GOING."
        );

        return;
      }


      /* =====================
         50
      ===================== */

      if (game.presses === 50) {

        showModal(
          "DON'T STOP."
        );

        return;
      }


      /* =====================
         100
      ===================== */

      if (game.presses === 100) {

        showModal(
          "PLEASE SUBSCRIBE 😭"
        );

        modalClose.textContent =
          "CONTINUE";

        /*
          Open immediately from the
          user's click so the browser
          allows the new tab.
        */

        window.open(
          milestoneLinks[100],
          "_blank",
          "noopener,noreferrer"
        );

        return;
      }


      /* =====================
         150
      ===================== */

      if (game.presses === 150) {

        showModal(
          "YOU MADE IT THIS FAR 💀"
        );

        modalClose.textContent =
          "CONTINUE";

        window.open(
          milestoneLinks[150],
          "_blank",
          "noopener,noreferrer"
        );

        return;
      }


      /* =====================
         200
      ===================== */

      if (game.presses === 200) {

        showModal(
          "WELL DONE 🔴"
        );

        modalClose.textContent =
          "CONTINUE";

        window.open(
          milestoneLinks[200],
          "_blank",
          "noopener,noreferrer"
        );

        return;
      }

    }


    /* =========================
       RESET GAME
    ========================= */

    function showResetModal() {

      resetOverlay.classList.add(
        "show"
      );

    }


    function closeResetModal() {

      resetOverlay.classList.remove(
        "show"
      );

    }


    function resetGame() {

      game.presses = 0;
      game.points = 0;

      localStorage.removeItem(
        "dontPressPresses"
      );

      localStorage.removeItem(
        "dontPressPoints"
      );

      updateUI();

      closeResetModal();

      closeModal();

    }


    /* =========================
       MAIN BUTTON
    ========================= */

    mainButton.addEventListener(
      "click",
      pressButton
    );


    /* =========================
       MODAL CLOSE
    ========================= */

    modalClose.addEventListener(
      "click",
      closeModal
    );


    modalOverlay.addEventListener(
      "click",
      (event) => {

        if (
          event.target ===
          modalOverlay
        ) {

          closeModal();

        }

      }
    );


    /* =========================
       RESET
    ========================= */

    resetButton.addEventListener(
      "click",
      showResetModal
    );

    resetCancel.addEventListener(
      "click",
      closeResetModal
    );

    resetConfirm.addEventListener(
      "click",
      resetGame
    );

    resetOverlay.addEventListener(
      "click",
      (event) => {

        if (
          event.target ===
          resetOverlay
        ) {

          closeResetModal();

        }

      }
    );


    /* =========================
       ESC KEY
    ========================= */

    document.addEventListener(
      "keydown",
      (event) => {

        if (event.key === "Escape") {

          closeModal();
          closeResetModal();

        }

      }
    );


    /* =========================
       COPY PROTECTION
    ========================= */

    document.addEventListener(
      "copy",
      (event) => {
        event.preventDefault();
      }
    );

    document.addEventListener(
      "cut",
      (event) => {
        event.preventDefault();
      }
    );

    document.addEventListener(
      "contextmenu",
      (event) => {
        event.preventDefault();
      }
    );

    document.addEventListener(
      "dragstart",
      (event) => {
        event.preventDefault();
      }
    );


    /* =========================
       START
    ========================= */

    updateUI();

  </script>


  <!-- =========================
       SERVICE WORKER
  ========================= -->

  <script>

    if (
      "serviceWorker" in navigator
    ) {

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker
            .register("./sw.js")

            .then(
              (registration) => {

                console.log(
                  "Service Worker registered:",
                  registration.scope
                );

              }
            )

            .catch(
              (error) => {

                console.error(
                  "Service Worker registration failed:",
                  error
                );

              }
            );

        }
      );

    }

  </script>

</body>
